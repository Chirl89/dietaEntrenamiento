<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitDuo - iOS Shortcut Debugger & Logger</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-title">
        <i class="fa-solid fa-terminal brand-icon"></i>
        <h1>FitDuo <span class="badge-tag">Shortcut Debugger</span></h1>
      </div>
      <div class="header-status" id="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">Listo para recibir datos</span>
      </div>
    </header>

    <main class="main-content">
      <!-- Action Controls -->
      <section class="controls-card">
        <div class="shortcut-config-row">
          <label for="shortcut-name-select" class="config-label">Atajo a Ejecutar:</label>
          <select id="shortcut-name-select" class="config-select">
            <option value="SincronizarSaludFitDuo">SincronizarSaludFitDuo (Salud Diaria)</option>
            <option value="SincronizarEntrenamientoFitDuo">SincronizarEntrenamientoFitDuo (Entrenamientos)</option>
            <option value="custom">Otro Atajo (Personalizado)...</option>
          </select>
          <input type="text" id="shortcut-name-custom" class="config-input" placeholder="Escribe el nombre del atajo" style="display: none;">
        </div>

        <div class="action-buttons-group">
          <!-- Button 1: Run Shortcut -->
          <button id="btn-run-shortcut" class="btn-primary">
            <i class="fa-solid fa-bolt"></i>
            <span>Ejecutar Atajo de iOS</span>
          </button>

          <!-- Button 2: Copy Logs -->
          <button id="btn-copy-logs" class="btn-secondary">
            <i class="fa-solid fa-clipboard"></i>
            <span>Copiar Logs al Portapapeles</span>
          </button>
        </div>

        <div class="utility-row">
          <button id="btn-clear-logs" class="btn-text">
            <i class="fa-solid fa-trash-can"></i> Limpiar Pantalla
          </button>
          <div class="log-counter">
            Total logs: <strong id="log-count">0</strong>
          </div>
        </div>
      </section>

      <!-- Logs Terminal View -->
      <section class="logs-card">
        <div class="logs-card-header">
          <span class="logs-title"><i class="fa-solid fa-rectangle-list"></i> Registro de Logs (Terminal en Vivo)</span>
          <div class="log-filters">
            <label><input type="checkbox" id="filter-auto-scroll" checked> Auto-scroll</label>
          </div>
        </div>
        <div id="logs-container" class="logs-container">
          <!-- Log entries appended here -->
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden">
    <i class="toast-icon fa-solid fa-circle-check"></i>
    <span id="toast-message">Mensaje</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
